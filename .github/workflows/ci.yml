name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the host tests read ace2k's coordinator module (ace2k_units) from ace2k's klippy/extras
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tobecwb/ace2k
          path: .ace2k
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # pytest 8 or later: 7 still runs a module-level setup() as a nose fixture.
      - name: Tools
        run: pip install ruff==0.16.9 'pytest>=8'
      - run: make lint
      - run: make installer-check
      - run: make test
        env:
          ACE2K_EXTRAS: ${{ github.workspace }}/.ace2k/klippy/extras
      # the page's tests import preact and htm from web/node_modules
      - run: npm ci --prefix web
      - run: make web-test
      - run: make web-lint
      - run: make web-quality

  # A tag opens a draft release with the files install.sh downloads; the maintainer publishes it
  # by hand after the bench.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/ace2k-u1-*.tar.gz
            dist/ace2k-u1-*.requires
            dist/install.sh
            dist/SHA256SUMS

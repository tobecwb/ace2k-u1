# ace2k's web page (docs/install.md, "The web page"); included by the U1's nginx from fluidd.d
location = /ace2k {
    return 301 /ace2k/;
}

# The two headers apply to the page only, never to the printer's other pages.
# no-cache: the browser revalidates every file (ETag), so after an update it never mixes new and
# old modules. The policy: scripts, styles and images from the page's own origin only (the page
# has no inline script but the import map, allowed by its hash; its views set inline style
# attributes, and the favicon is a data: URL), and the printer's websocket on the page's own host
# and port only. 'self' covers ws: and wss: there, so the policy carries no host name.
# A location with its own add_header drops every add_header of the server block around it. So a
# header that the printer's server block sets does not reach the page: repeat it here.
location /ace2k/ {
    alias /home/lava/ace2k-web/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-7P+9WvN2RAbvVKnTwpKDaBc8CLVmVJv5Lg7ULTMpwmQ='; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
}

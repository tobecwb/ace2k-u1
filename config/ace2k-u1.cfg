# ace2k on a Snapmaker U1: the U1's own feed flows drive the unit (docs/install.md). Every
# setting is described in docs/configuration.md.
# Lane n feeds head n (extruder n-1) through its own tube. A macro added here must carry no digit
# in its name: Klipper reads a digit as the start of a parameter.

[ace2k_u1]
#lanes: 1, 2, 3, 4       # lanes wired to a head (lane n feeds head n); one left out stays the U1's
#feed_speed: 70          # mm/s (the unit's 9-70): the push toward a head, and the follow
#head_budget_mm: 2000    # mm: the longest push toward a head before its sensor sees the filament
#poll_ms: 200            # ms (50-1000): how often the bays are watched
#retry_push_mm: 10       # mm (1-40): fed when the U1's load finds the filament did not extrude
#apply_tags: True        # a spool's tag sets its head's filament setting; False: off
#runout_source: head    # head: the head's sensor pauses at the filament's end; unit: at tail_out
#grip_mm: 40            # mm (10-45): a filament put in while its head still holds a piece the
#                       # lane does not own is only pulled this far, until the gear holds it
#eject_probe_mm: 10     # mm (5-30): ACE_EJECT with the head's sensor set first rolls back this far
#eject_probe_speed: 10  # mm/s (5-30): that probe's speed
#eject_settle_ms: 500   # ms (200-2000): after that probe, the wait for the lane's buffer plunger:
#                       # at rest, the filament is free and the unit unloads it; moved, the head
#                       # holds it and the U1 unloads the head first
# ACE_EJECT LANE=n [WAIT=0|1] is the adapter's own command (docs/install.md)

[ace2k_u1_history]
# the history the web page draws (docs/install.md, "The web page"): one JSON-lines file per day
#interval: 30          # seconds between samples of the chamber, humidity and heater outlets
#keep_days: 7
#path: /home/lava/printer_data/logs/ace2k   # under Moonraker's "logs" root: the page reads it there

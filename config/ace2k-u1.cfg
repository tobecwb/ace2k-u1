# ace2k on a Snapmaker U1: the U1's own feed flows drive the unit (docs/install.md). Every
# setting is described in docs/configuration.md.
# By default lane n feeds head n (extruder n-1) through its own tube; lanes: can place lanes of
# several units on the heads, and join several lanes on one head through a splitter (+). A
# macro added here must carry no digit
# in its name: Klipper reads a digit as the start of a parameter. The two ACEK_SWAP_* macros below
# are the lane swap's own (docs/configuration.md, "The lane swap's macros").

[ace2k_u1]
#lanes: 1, 2, 3, 4       # lanes wired to a head (lane n feeds head n); one left out stays the U1's
#                        # several units: one <unit>:<lane> per head, in head order (a:1, a:2, b:1)
#                        # several lanes on one head through a splitter: joined by +
#                        # (a:1+a:2, a:3, a:4)
#feed_speed: 70          # mm/s (the unit's 9-80): the push toward a head, and the follow
#head_budget_mm: 2000    # mm: the longest push toward a head before its sensor sees the filament
#poll_ms: 200            # ms (50-1000): how often the bays are watched
#tag_push_speed: 70      # mm/s (0, or the unit's 9-80): a head one lane feeds, its tag not read:
#                        # the push runs at this speed (at most feed_speed) for the rest of the tag
#                        # search, with no return to the parking point; 0: the search runs and
#                        # returns first
#retry_push_mm: 10       # mm (1-40): fed when the U1's load finds the filament did not extrude
#apply_tags: True        # a spool's tag sets its head's filament setting; False: off
#runout_source: head    # head: the head's sensor pauses at the filament's end; unit: at the
#                       # bay's sensor, refilled as a shared head (below)
#                       # heads several lanes feed take a spool's end at the unit's bay sensor,
#                       # whatever runout_source says: the lane stops, the print pauses, the
#                       # head unloads and the rest rolls out of the bay; a new spool, RESUME
#grip_mm: 40            # mm (10-45): a filament put in while its head still holds a piece the
#                       # lane does not own is only pulled this far, until the gear holds it;
#                       # a head one lane feeds, on an image with the wait, pulls nothing
#eject_probe_mm: 80     # mm (20-150): ACEK_EJECT with the head's sensor set first rolls back up to
#                       # this far, stopped once the lane's buffer plunger reads taut
#eject_probe_speed: 10  # mm/s (5-30, within the unit's 9-80): that probe's speed. Below the
#                       # unit's own floor (9 on ace2k's images) the adapter is not hooked
#eject_settle_ms: 500   # ms (200-2000): after that probe, the wait for the lane's buffer plunger:
#                       # at rest, the filament is free and the unit unloads it; moved, the head
#                       # holds it and the U1 unloads the head first
#temp_ranges: PLA:190-230, PETG:220-260, ABS:230-270, ASA:230-270, TPU:210-240
#                       # °C (150-350) per material: a head set outside its lane's range is
#                       # warned about (console and page), never refused; at a print's start, and
#                       # outside a print for M104, M109 and the screen. Empty: no warning
# The keys below are read only for a head several lanes feed (lanes: with +).
#head1_splitter_mm: 1000 # mm (up to 2000), one key per head, head1 to head4, only on a head
#                       # several lanes feed: how far a swap rolls the old lane back, so its tip
#                       # is behind the splitter. Measure it with ACEK_SPLITTER_MEASURE HEAD=n, then
#                       # SAVE_CONFIG. Or by tape: the U1's tube from its inlet to the gear (about
#                       # 810) + the tube to the splitter + the splitter + 30 margin (one 4-to-1
#                       # splitter on the bench: 990; two in a row: 1140)
#swap_speed: 80         # mm/s (the unit's 9-80): a swap's roll back of the old lane and push of the new
#                       # lane; left out: 80, or each unit's top speed when lower (70 on an older image)
#colour_max_distance: 25 # the farthest a spool's colour may be from the file's for the page to
#                       # suggest it (CIE76 dE, as the eye sees it)
#colour_min_margin: 8   # how much closer the best spool must be than the second, or none is
#                       # suggested (two black spools)
#probe_mm: 100         # mm (60-300): how far a probe rolls a lane back with the head's sensor
#                       # set; it must exceed the buffer's slack (about 50 mm), which a held lane
#                       # takes up with its plunger at rest, or a held lane reads free
#probe_speed: 50        # mm/s (the unit's 9-80): every probe move, the swap's free check among them.
#                       # On the bench a held lane read held and a free one free at every speed
#                       # from 10 to 70; a lower speed makes meeting another filament softer
#probe_max_temp: 60     # °C (30-150): the hottest the head may be for a probe with its sensor set
#unload_temps: PLA:220  # °C (150-350) per material, as PLA:220, PETG:240: a swap's unload forms
#                       # the old filament's tip at it; a material not listed takes the U1's own
#                       # unload temperature
#background_heads:      # heads 1-4, as 1 or 1,4; empty: none. Only a head several lanes feed. The
#                       # head swaps its lane while parked in its dock, while another head prints.
#                       # The new filament's first pushes come out in the dock, so only for a head
#                       # whose dock carries the adapted nozzle wiper, with an opening under the
#                       # parked nozzle, and a larger waste bin under the docks. The adapter cannot
#                       # check the dock. The head arrives ready to print: only the cut and the
#                       # clean are left when it is picked. Not recommended as it is: even with
#                       # the modified dock, the chance that oozed plastic or a strand soils the
#                       # print, or that colours mix in it, is high
#background_purge_mm: 10 # mm (0-100): after its 40 mm through the gear, a background swap
#                       # purges the new filament this far more in the dock, in the same move; it
#                       # falls through the dock's opening. 0: the purge runs at the cleaning area
#                       # when the head is picked
# ACEK_EJECT LANE=n [WAIT=0|1] is the adapter's own command (docs/install.md)

# !!! DANGER !!! The two macros below run inside a print, with a hot nozzle, every time a head
# changes its lane. A wrong G-code here can crash the head into the dock, the cleaning area or the
# part, and damage the printer and the extruder. Change them only if you are sure of what every
# line does. They must not move the unit (no ACEK_* or ACE_* command): the adapter does that.
# The parameters they receive are described in docs/configuration.md.

[gcode_macro ACEK_SWAP_UNLOAD]
# The old filament out of the head: forms the tip and takes it out of the gear. Ends heating
# toward the temperature the new filament loads at (its printing temperature when known, else
# the U1's load temperature; 0 on a refill), while the unit rolls the old one back. Its
# parameters: HEAD, TEMP, SOFT, NOZZLE_DIAMETER, LOAD_TEMP, MATERIAL (the old filament's).
gcode:
  INNER_FILAMENT_UNLOAD TEMP={params.TEMP} SOFT={params.SOFT} NOZZLE_DIAMETER={params.NOZZLE_DIAMETER}
  M104 S{params.LOAD_TEMP} T{params.HEAD} A0

[gcode_macro ACEK_SWAP_LOAD]
# The new filament into the head, whose tip waits at the head's sensor: through the gear and the
# purge at the load temperature, which is the new filament's printing temperature when the swap
# knows it, else the U1's load temperature, then the U1's clean. The swap then runs the U1's own
# pre-extrusion with no purge, which cleans again: two cleans in a row keep the nozzle from oozing
# on the way out. With it the swap retracts what the slicer retracted when the tool last left
# the head (10 mm in the files seen), because the slicer pushes it back at the tower; a tool used
# for the first time keeps the U1's 0.5 mm. So this macro must not retract. This purge is the
# swap's only one, so a custom macro must purge. Its parameters: HEAD, LOAD_TEMP, PRINT_TEMP,
# MATERIAL (the new filament's), GRIP (0 when a background swap already took the filament
# through the gear in the dock; 1 by default).
gcode:
  MOVE_TO_DISCARD_FILAMENT_POSITION
  M109 S{params.LOAD_TEMP} T{params.HEAD} A0
  M83
  {% if params.GRIP|default(1)|int %}
  G1 E40 F360          ; through the gear, refilling what the unload retracted
  {% endif %}
  G1 E10 F360          ; purge, at the speed of the U1's pre-extrusion at a printing temperature
  ROUGHLY_CLEAN_NOZZLE_WITH_DISCARD

[ace2k_u1_history]
# the history the web page draws (docs/install.md, "The web page"): one JSON-lines file per day
#interval: 30          # seconds between samples of the chamber, humidity and heater outlets
#keep_days: 7
#path: /home/lava/printer_data/logs/ace2k   # under Moonraker's "logs" root: the page reads it there

# mypy --strict on every host module: klippy/extras and scripts, a new module included as it
# lands there.
[mypy]
# mypy 2.4 refuses 3.9; ruff's target-version stays py39, the syntax floor
python_version = 3.10
strict = True
warn_unreachable = True
# this tree's klippy and ace2k's as the bases: on the printer both install into one klippy/extras,
# so the host modules of both are the package `extras` (as Klipper imports them) and a relative
# import of either resolves; the bare-name fallback the host tests use is the one ignored
mypy_path = klippy:../ace2k/klippy
explicit_package_bases = True
namespace_packages = True
files = klippy/extras, scripts, tools

# Klipper's own module, present only on the printer
[mypy-msgproto]
ignore_missing_imports = True

# The U1's side-feeder module, present only on the printer
[mypy-filament_feed]
ignore_missing_imports = True
